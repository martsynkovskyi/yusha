<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow" data-i18n="eyebrow">PRONAĐEN</p>
      <h1 data-i18n="name">JUŠA</h1>
      <p class="hero-line" data-i18n="heroLine">Hvala svima na pomoći</p>

    <figure class="portrait">
      <img id="portrait" src="yusha.jpg" alt="Juša, veliki srebrno-sivi dugodlaki mačak">
    </figure>

    <section class="last-seen" aria-label="Ažuriranje" data-i18n-aria-label="lastSeenLabel">
      <strong data-i18n="lastSeenDate">27. septembra 2026.</strong>
      <span data-i18n="lastSeenPlace">Juša je pronađen i sada je na sigurnom</span>

      <p class="update-appeal" data-i18n="updateAppeal">Hvala svima koji su pomagali u potrazi. Stare objave o potrazi više nisu aktuelne.</p>
    </section>

    <section class="contact" aria-label="Kontakt" data-i18n-aria-label="contactLabel">
      <button class="share" type="button" id="share-button" data-i18n="shareButton">Podelite ovu stranicu</button>
      <p class="share-status" id="share-status" role="status" aria-live="polite"></p>
      <p class="updated" data-i18n="updated">Ažurirano 27.09.2026.</p>
      <div class="language-switch" role="group" aria-label="Izbor jezika" data-i18n-aria-label="languageSwitchLabel">
        <button type="button" id="language-sr" aria-pressed="true" aria-label="Prikaži na srpskom">SR</button>
        <button type="button" id="language-ru" aria-pressed="false" aria-label="Показать на русском">RU</button>
